# Supabase Auth & Project Configuration for Heat Chat

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
port = 9999
site_url = "https://heatchat.app"
additional_redirect_urls = ["https://heatchat.app/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Email OTP Length MUST BE EXACTLY 6 DIGITS
otp_length = 6
# Email OTP Expiry = 600 seconds (10 minutes)
otp_expiry = 600

[auth.sms]
enable_signup = false
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
